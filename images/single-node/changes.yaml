# Background changes for the Recent changes tab, shown in every scenario on
# this image beside the scenario's own changes.yaml. They're real-looking
# and harmless, so that a change in the list is never a pointer on its
# own. `before` is how long before the session started. Not part of the
# built image (vm.Fingerprint skips it).
- id: shop#1174
  title: "Order history: show 20 orders per page"
  author: mina
  team: Shop developers
  before: 50h
  status: Merged and deployed in release 2.3.1
  description: |
    Customers with a long history were getting one very long page. This
    pages the list at 20 orders, newest first, with "Older orders" links.
  diff: |
    --- a/internal/api/orders.go
    +++ b/internal/api/orders.go
    @@ -88,7 +88,10 @@ func (h *Handler) orderHistory(w http.ResponseWriter, r *http.Request) {
     	customer := customerID(r)
    -	orders, err := h.store.Orders(ctx, customer)
    +	page := pageParam(r)
    +	orders, err := h.store.OrdersPage(ctx, customer, page, ordersPerPage)
     	if err != nil {
     		h.fail(w, r, err)
     		return
     	}
