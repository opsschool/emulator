# Site resolver. Answers for shop.internal; anything else asked of it goes
# through the local stub to the network's resolver.
bind-dynamic
listen-address=10.53.0.10
no-resolv
no-hosts
server=127.0.0.53
# Answer every shop.internal query here, including AAAA, and never forward
# one: the stub would send it straight back.
local=/shop.internal/
address=/payments.shop.internal/10.54.0.20
address=/shop.internal/127.0.0.1
