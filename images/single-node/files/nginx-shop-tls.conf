# HTTPS for the mobile app and API clients, and for partner integrations.
server {
    listen 443 ssl;
    server_name api.shop.internal;
    ssl_certificate     /etc/nginx/tls/api.shop.internal.crt;
    ssl_certificate_key /etc/nginx/tls/api.shop.internal.key;

    location / {
        proxy_pass http://shop;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    server_name partners.shop.internal;
    ssl_certificate     /etc/nginx/tls/partners.shop.internal.crt;
    ssl_certificate_key /etc/nginx/tls/partners.shop.internal.key;

    location / {
        proxy_pass http://shop;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
