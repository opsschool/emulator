name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shop_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt
      - name: go build
        run: go build ./...
      - name: go vet
        run: make vet
      - name: go test
        env:
          SHOP_TEST_DSN: root:root@tcp(127.0.0.1:3306)/shop_test
        run: go test -race ./...
      - name: build fault variants
        run: for t in faultconnleak faultmemleak faultidletx faultnobackoff; do go build -tags "$t" -o /dev/null ./demoapp/cmd/shop; done
      - name: shellcheck
        run: make shellcheck
      - name: opsschool validate
        run: make validate
