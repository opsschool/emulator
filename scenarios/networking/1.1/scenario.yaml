category: networking
image: single-node
curriculum: https://www.opsschool.org/dns_101.html
alerts:
  - "ShopOrderErrors: more than 5% of POST /orders requests are failing (5xx)"
summary: >
  Checkout is failing: customers get an error when they place an order.
  Browsing works. The payments team says their service is healthy and has
  seen no requests from the shop for the last few minutes.
randomize:
  dead_resolver:
    choices: [10.53.0.11, 10.53.0.12, 10.53.0.53]
fix_verification:
  restart: [shop.service, systemd-resolved.service]
  reboot: true
  load_replay: 60s
mitigate_hold: 60s
time_limit: 45m
target_time: 15m
