mitigated:
  - name: order error rate under 1%
    type: promql
    expr: >
      (sum(rate(http_requests_total{route="POST /orders",code=~"5.."}[1m])) or vector(0))
      / sum(rate(http_requests_total{route="POST /orders"}[1m])) < 0.01
fixed:
  - name: the connection tracking table is sized for the host
    type: script
    run: checks/conntrack_ok.sh
  - name: no packets dropped for a full table during load
    type: promql
    expr: >
      (sum(increase(node_nf_conntrack_stat_drop[3m])) or vector(0))
      + (sum(increase(node_nf_conntrack_stat_early_drop[3m])) or vector(0)) == 0
  - name: the firewall still drops invalid packets
    type: script
    run: checks/firewall_ok.sh
preserve:
  - name: no orders lost
    type: script
    run: checks/orders_preserved.sh
