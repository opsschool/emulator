mitigated:
  - name: error rate stayed under 1% for the last 3 minutes
    type: promql
    expr: >
      max_over_time(((sum(rate(http_requests_total{code=~"5.."}[1m])) or vector(0))
      / sum(rate(http_requests_total[1m])))[3m:15s]) < 0.01
fixed:
  - name: the connection tracking table is sized for the host
    type: script
    run: checks/conntrack_ok.sh
  - name: p99 latency stayed under 250ms for the last 3 minutes
    type: promql
    expr: >
      max_over_time((histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[30s]))))[3m:15s]) < 0.25
  - name: the firewall still drops invalid packets
    type: script
    run: checks/firewall_ok.sh
preserve:
  - name: no orders lost
    type: script
    run: checks/orders_preserved.sh
