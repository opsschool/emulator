category: networking
image: single-node
curriculum: https://www.opsschool.org/networking_201.html
alerts:
  - "ShopErrorRate: more than 5% of requests failing at peak, some taking 10s"
summary: >
  At busy times the shop hangs or fails for a share of customers; at quiet
  times it's fine. The shop's own metrics show nothing slow. The security
  team turned on stateful firewalling yesterday, and a kernel tuning change
  went out with the same maintenance.
randomize:
  max:
    choices: ["38", "40"]
fix_verification:
  restart: [shop.service, shop-worker.service]
  reboot: true
  load_replay: 180s
load:
  profile: peak
# The mitigated check already looks back over 3 minutes, a full peak cycle.
mitigate_hold: 60s
time_limit: 45m
target_time: 25m
