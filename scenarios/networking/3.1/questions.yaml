- id: what
  prompt: What dropped the packets?
  type: choice
  choices:
    - The payments service
    - The kernel, because its connection tracking table was full
    - A firewall rule that blocked payments
    - The DNS server
  answer: 1
- id: max
  prompt: What was nf_conntrack_max set to?
  type: text
  answer_from_var: max
- id: why-peak
  prompt: Why did failures only happen at busy times?
  type: choice
  choices:
    - The shop was slower at peak
    - Each new connection and DNS lookup needs a tracking entry, and at peak there are more of them than the table holds
    - The firewall rule only applies at peak
    - Peak traffic uses more memory
  answer: 1
