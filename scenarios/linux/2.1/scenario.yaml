category: linux
image: single-node
curriculum: https://www.opsschool.org/filesystems_101.html
alerts:
  - "ShopOrderErrors: more than 5% of POST /orders requests are failing (5xx)"
summary: >
  Checkout is failing for every customer; browsing still works. Storage
  alerts fired overnight. The on-call engineer deleted some large files and
  says that should have fixed it.
randomize:
  variant:
    choices: [deleted-log, inodes]
fix_verification:
  restart: [shop.service, shop-worker.service]
  reboot: false
  load_replay: 120s
mitigate_hold: 60s
time_limit: 45m
target_time: 25m
