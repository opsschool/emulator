- id: OPS-1874
  title: Run the maintenance job weekly instead of hourly
  author: sam
  team: SRE
  before: 170h
  when: {variant: inodes}
  status: Merged and deployed
  description: |
    The report query in the maintenance job slows the database down at
    peak. Reports are only read on Mondays, so weekly is plenty.
  diff: |
    --- a/cron.d/shop-maintenance
    +++ b/cron.d/shop-maintenance
    @@ -1,3 +1,4 @@
    -# Nightly report and session cleanup. Runs hourly so reports stay fresh.
    +# Nightly report and session cleanup. Weekly: the report query was slowing
    +# the database at peak (OPS-1874).
     SHELL=/bin/bash
    -17 * * * * shop set -a; source /etc/shop/shop.env; set +a; /opt/shop/current/shop maintenance >/dev/null 2>&1
    +17 3 * * 0 shop set -a; source /etc/shop/shop.env; set +a; /opt/shop/current/shop maintenance >/dev/null 2>&1
