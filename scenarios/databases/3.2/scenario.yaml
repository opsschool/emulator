category: databases
image: single-node
curriculum: https://www.opsschool.org/databases_201.html#locks-and-long-transactions
alerts:
  - "ShopOrderErrors: more than 5% of POST /orders requests are failing (5xx)"
  - "ShopRouteLatency: p99 of GET /customers/{id}/orders above 500ms for 5m"
summary: >
  Checkout and the order history page are timing out. Browsing the catalog
  works, and MySQL is up and answering. The developers released 2.4.0 a
  little while ago, then ran a migration that adds a column for gift notes.
  They say it's an instant change, but it has been "running" for minutes.
randomize:
  migration:
    choices: [20261005_0905, 20261005_0932, 20261005_1018]
fix_verification:
  restart: [shop-worker.service, shop.service]
  reboot: false
  load_replay: 150s
mitigate_hold: 60s
time_limit: 45m
target_time: 25m
