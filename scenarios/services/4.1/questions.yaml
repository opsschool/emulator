- id: chain
  prompt: Why did MySQL go down when its data volume had plenty of space?
  type: choice
  choices:
    - Its data volume was secretly full
    - InnoDB's temporary files live in tmpdir on the root disk, which the thumbnail service filled
    - The thumbnail service killed it
    - It ran out of memory
  answer: 1
- id: photo
  prompt: Which photo set it off?
  type: text
  answer_from_var: photo
- id: stopping
  prompt: Why is stopping the thumbnail service only a mitigation?
  type: choice
  choices:
    - It is a fine fix
    - New products get no thumbnails, and the bad release is still deployed, so the next corrupt photo does the same
    - Stopping services is never allowed
    - It makes MySQL slower
  answer: 1
