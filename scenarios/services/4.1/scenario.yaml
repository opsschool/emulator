category: services
image: single-node
curriculum: https://www.opsschool.org/troubleshooting_101.html
alerts:
  - "ShopOrderErrors: more than 5% of POST /orders requests are failing (5xx)"
  - "HostFilesystemFull: / has less than 1% space left"
summary: >
  Nobody can check out; browsing the catalog still works. Nobody has
  deployed the shop today. Wally uploaded photos for the new honey-roasted
  range this morning, and the thumbnail service had an update from its
  vendor overnight.
randomize:
  photo:
    choices: [IMG_2231.jpg, IMG_2236.jpg, IMG_2240.jpg]
fix_verification:
  restart: [redis-server.service, shop.service, shop-thumbs.service]
  reboot: false
  load_replay: 120s
mitigate_hold: 120s
time_limit: 60m
target_time: 35m
# Hosted mode and --driver container skip this scenario.
needs_vm: it fills the root disk, which in a container is the host's disk
