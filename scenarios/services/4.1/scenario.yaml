category: services
image: single-node
curriculum: https://www.opsschool.org/troubleshooting_101.html
alerts:
  - "ShopHealthCheckFailing: /health through the load balancer has failed for 2m"
  - "MySQLDown: mysqld is not running"
  - "HostFilesystemFull: / has less than 1% space left"
summary: >
  The shop is down. MySQL crashed and won't start again, although its data
  volume has plenty of space. Nobody has deployed the shop today. Wally
  uploaded photos for the new honey-roasted range this morning, and the
  thumbnail service had an update from its vendor overnight.
randomize:
  photo:
    choices: [IMG_2231.jpg, IMG_2236.jpg, IMG_2240.jpg]
fix_verification:
  restart: [mysql.service, redis-server.service, shop.service, shop-thumbs.service]
  reboot: false
  load_replay: 120s
mitigate_hold: 120s
time_limit: 60m
target_time: 35m
