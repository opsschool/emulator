- id: limit
  prompt: What limited the shop?
  type: choice
  choices:
    - Memory
    - The number of tasks (threads) systemd allowed the service
    - Open file descriptors
    - CPU
  answer: 1
- id: tasks
  prompt: What was TasksMax set to?
  type: text
  answer_from_var: tasks
- id: why-peak
  prompt: Why did it only crash when busy?
  type: choice
  choices:
    - Garbage collection
    - Go needs an OS thread for each goroutine blocked in a system call, such as fsync, and there are more of those at peak
    - The load balancer sends more traffic at peak
    - Peak traffic uses more memory
  answer: 1
